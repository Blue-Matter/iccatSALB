name: Mirror to client repo

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add mirror notice to README
        run: |
          NOTICE='<!-- mirror-notice -->
> **Note:** This repository is a read-only mirror, automatically synced from [Blue-Matter/iccatSALB](https://github.com/Blue-Matter/iccatSALB). Please do not edit files here directly — changes will be overwritten on the next sync.
'
          printf '%s\n\n%s' "$NOTICE" "$(cat README.md 2>/dev/null)" > README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add mirror notice to README" || true

      - name: Set up SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "$CLIENT_REPO_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
        env:
          CLIENT_REPO_SSH_KEY: ${{ secrets.CLIENT_REPO_SSH_KEY }}

      - name: Push to client repo
        run: |
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            git push --force git@github.com:ICCAT/salb-mse.git main
